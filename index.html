<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flux – Générateur IA</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- TON CSS EXTERNE -->
  <link rel="stylesheet" href="cercle.css">
</head>

<body>
<!-- MONETAG -->
<script async data-cfasync="false" src="//adnetworkperformance.com/a/display.php?r=3411758"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

  <!-- LOADER -->
  <div id="loader"></div>
  <p class="loading-text" id="loadingText" style="display:none;">Génération en cours…</p>

  <h1>Générer une image IA--- By KML MHALLA</h1>
  <!-- Zone pub en haut -->
  <div id="adHeader"></div>

  <!-- Zone pub en bas -->
  <div id="adFooter"></div>

  <!-- PROMPT -->
  <input id="prompt" type="text" placeholder="Décris ton image...">

  <!-- COPIE PROMPT -->
  <button id="copyPromptBtn">Copier le prompt</button>
  <span id="copyStatus" style="display:none; color:green;">Copié !</span>

  <!-- COPIE IMAGE -->
  <button id="copyImageBtn">Copier l’image (base64)</button>
  <span id="copyImageStatus" style="display:none; color:green;">Copié !</span>

  <!-- STYLE IA -->
  <select id="style">
    <option value="realistic">Réaliste</option>
    <option value="anime">Animé</option>
    <option value="cartoon">Cartoon</option>
    <option value="cyberpunk">Cyberpunk</option>
    <option value="fantasy">Fantasy</option>
  </select>

  <!-- BOUTON GENERER -->
  <button id="btn">Générer</button>

  <!-- IMAGE RESULTAT -->
  <img id="result" width="512" crossOrigin="anonymous">

  <!-- TELECHARGEMENT -->
  <a id="downloadBtn" download="flux_image.png">Télécharger l’image</a>

  <!-- SCRIPT IA -->
  <script src="api.js"></script>

</body>
</html>
